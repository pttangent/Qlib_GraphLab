name: NFF stock-day pilot

on:
  pull_request:
    paths:
      - "qlib/contrib/data/nff_episode.py"
      - "qlib/contrib/model/nff_generic.py"
      - "examples/nff_stockday_episode.py"
      - "examples/nff_generic_baseline.py"
      - "configs/nff_stockday_generic_pilot.yaml"
      - "tests/test_nff_episode.py"
      - "tests/test_nff_generic.py"
      - "docs/component/nff_stockday_pilot.md"
      - ".github/workflows/nff-stockday-pilot.yml"
  push:
    branches:
      - "agent/nff-stockday-episode-generic-pilot"
      - "codex/**"
    paths:
      - "qlib/contrib/data/nff_episode.py"
      - "qlib/contrib/model/nff_generic.py"
      - "examples/nff_stockday_episode.py"
      - "examples/nff_generic_baseline.py"
      - "configs/nff_stockday_generic_pilot.yaml"
      - "tests/test_nff_episode.py"
      - "tests/test_nff_generic.py"
      - "docs/component/nff_stockday_pilot.md"
      - ".github/workflows/nff-stockday-pilot.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qlib and test dependencies
        run: python -m pip install -e ".[dev]" torch
      - name: Run stock-day pilot tests
        run: >-
          python -m pytest -q
          tests/test_nff_episode.py
          tests/test_nff_generic.py
          tests/test_nff_adapter.py
          --tb=short
      - name: Compile pilot entrypoints
        run: >-
          python -m py_compile
          qlib/contrib/data/nff_episode.py
          qlib/contrib/model/nff_generic.py
          examples/nff_stockday_episode.py
          examples/nff_generic_baseline.py
          tests/test_nff_episode.py
          tests/test_nff_generic.py
