name: NFF adapter

on:
  pull_request:
    paths:
      - "qlib/contrib/data/nff.py"
      - "tests/test_nff_adapter.py"
      - "tests/test_nff_research_v2_2.py"
      - "tests/test_nff_research_v2_4_fastpath.py"
      - "tests/test_nff_research_v2_4_entry.py"
      - "examples/nff_qlib_pipeline.py"
      - "examples/configs/nff_qlib_example.json"
      - "configs/v2_1_neutralized_full.yaml"
      - "configs/v2_4_optimized_full.yaml"
      - "nff_research/**"
      - "docs/component/nff_adapter.md"
      - ".github/workflows/nff-adapter.yml"
  push:
    branches:
      - "agent/nff-direct-qlib-adapter"
      - "agent/nff-research-fastpath-v2-4"
      - "agent/nff-research-atomic-fastpath-v2-7"
      - "codex/**"
    paths:
      - "qlib/contrib/data/nff.py"
      - "tests/test_nff_adapter.py"
      - "tests/test_nff_research_v2_2.py"
      - "tests/test_nff_research_v2_4_fastpath.py"
      - "tests/test_nff_research_v2_4_entry.py"
      - "examples/nff_qlib_pipeline.py"
      - "examples/configs/nff_qlib_example.json"
      - "configs/v2_1_neutralized_full.yaml"
      - "configs/v2_4_optimized_full.yaml"
      - "nff_research/**"
      - ".github/workflows/nff-adapter.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qlib and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run NFF adapter and research tests
        run: >-
          python -m pytest -q
          tests/test_nff_adapter.py
          tests/test_nff_research_v2_2.py
          tests/test_nff_research_v2_4_fastpath.py
          tests/test_nff_research_v2_4_entry.py
          tests/test_nff_v2_7_schema_contract.py
          --tb=short
      - name: Compile executable research entrypoints
        run: >-
          python -m py_compile
          qlib/contrib/data/nff.py
          examples/nff_qlib_pipeline.py
          tests/test_nff_adapter.py
          tests/test_nff_research_v2_2.py
          tests/test_nff_research_v2_4_fastpath.py
          tests/test_nff_research_v2_4_entry.py
          tests/test_nff_v2_7_schema_contract.py
          nff_research/v2_multilabel_runner.py
          nff_research/v2_1_neutralized_runner.py
          nff_research/v2_4_optimized_runner.py
          nff_research/v2_4_optimized_entry.py
          nff_research/nff_schema_contract.py
          nff_research/v2_7_atomic_campaign.py
          nff_research/v2_7_atomic_entry.py
          nff_research/v2_7_models.py
          nff_research/v2_7_ablation.py
          nff_research/v2_7_runtime_hardening.py
          nff_research/v2_7_run.py
          nff_research/v2_7_launch.py
      - name: Import canonical v2.7 launcher
        run: python -c "import nff_research.v2_7_launch as launch; assert callable(launch.main)"
