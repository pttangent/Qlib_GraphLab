name: NFF adapter

on:
  pull_request:
    paths:
      - "qlib/contrib/data/nff.py"
      - "tests/test_nff_adapter.py"
      - "examples/nff_qlib_pipeline.py"
      - "examples/configs/nff_qlib_example.json"
      - "configs/v2_1_neutralized_full.yaml"
      - "nff_research/**"
      - "docs/component/nff_adapter.md"
      - ".github/workflows/nff-adapter.yml"
  push:
    branches:
      - "agent/nff-direct-qlib-adapter"
      - "codex/**"
    paths:
      - "qlib/contrib/data/nff.py"
      - "tests/test_nff_adapter.py"
      - "examples/nff_qlib_pipeline.py"
      - "examples/configs/nff_qlib_example.json"
      - "configs/v2_1_neutralized_full.yaml"
      - "nff_research/**"
      - ".github/workflows/nff-adapter.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qlib and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run NFF adapter tests
        run: python -m pytest -q tests/test_nff_adapter.py --tb=short
      - name: Compile executable example
        run: python -m py_compile qlib/contrib/data/nff.py examples/nff_qlib_pipeline.py tests/test_nff_adapter.py
