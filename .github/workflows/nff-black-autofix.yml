name: NFF Black autofix

on:
  push:
    branches:
      - agent/nff-direct-qlib-adapter

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nff-direct-qlib-adapter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format changed Python files
        run: |
          python -m pip install black==24.8.0
          black -l 120 qlib/contrib/data/nff.py examples/nff_qlib_pipeline.py tests/test_nff_adapter.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qlib/contrib/data/nff.py examples/nff_qlib_pipeline.py tests/test_nff_adapter.py
          git commit -m "style(nff): apply repository Black formatting"
          git push origin HEAD:agent/nff-direct-qlib-adapter
