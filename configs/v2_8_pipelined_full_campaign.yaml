research_version: "2.8-pipelined-selection"
base_runner_version: "2.7-real-schema-atomic"

run:
  name: v2_8_pipelined_selection_20260807_r2
  script: nff_research/v2_8_launch.py
  start_date: "2026-01-02"
  end_date: "2026-07-22"
  horizons: [1, 5, 15, 30, 60]
  retries: 3
  min_cross_section_n: 30
  allow_mixed_contracts: true

atomic:
  factor_block_size: 8
  # Four intra-date threads are reserved for warehouse/factor operations.
  # Cheap raw-screen workers are mainly process-parallel and may use a larger
  # date-worker count.
  intra_date_workers: 4
  exact_future_lookup_cache: true
  residual_matrix_cache: true
  vectorized_deciles: true
  stage_checkpoints: true

local_paths:
  warehouse_root: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_warehouse"
  # The active v2.7 resource report shows run outputs under C:/NFF_research.
  research_root: "C:/NFF_research"
  raw_1m_root: "D:/DEV/AnotherNetworkFactory/RAW_DATA/1m"
  nodefactorfactory_src: "D:/DEV/AnotherNetworkFactory/NodeFactorFactory/src"
  industry_metadata: "D:/DEV/AnotherNetworkFactory/warehouses/metadata/symbol_metadata.parquet"

pipeline:
  controls_path: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_research/derived_inputs/daily_bar_controls_v2_1/daily_controls_2026-01-02_2026-07-22.parquet"
  memory_reserve_gb: 28
  minimum_launch_headroom_gb: 8
  portfolio_threads: 4
  # Materialize workers may coexist, but only a bounded number may enter the
  # short warehouse-load + supplement/sketch/condition/venue wide-merge peak.
  # These are execution-only settings and are deliberately excluded from the
  # materialize semantic/checkpoint contract.
  materialize_internal:
    peak_slots: 1
    peak_entry_min_available_gb: 48
    gate_poll_seconds: 0.5
    stale_lease_seconds: 3600
    stream_factor_blocks: true
    release_arrow_memory: true
  stages:
    # Four date processes remain available.  A cross-process peak gate prevents
    # all four from simultaneously reaching the observed 25-30+ GB high-water
    # substage; completed factor blocks stream directly to checkpoint storage.
    materialize:
      max_workers: 4
      estimated_worker_gb: 16
    # Raw screen streams eight-factor blocks and can use process-level CPU width.
    basic_screen:
      max_workers: 16
      estimated_worker_gb: 5
    # Candidate-only residualization/deciles remain the heaviest RSS stage.
    detailed:
      max_workers: 4
      estimated_worker_gb: 18
    # Four date processes × four sleeve threads avoids CPU oversubscription.
    portfolio:
      max_workers: 4
      estimated_worker_gb: 10

selection:
  mode: frozen_training_window
  train_days: 60
  primary_universe: final_trading_universe
  screen_universes:
    - all_pit_eligible
    - final_trading_universe
  # All 464 physical factors receive this cheap raw screen. Expensive
  # neutralization, deciles and portfolio work happen only after multi-track
  # training-period selection.
  screen_labels:
    - family: return_open_to_open
      horizons: [1, 5, 15, 30, 60]
    - family: return_vwap_to_vwap
      horizons: [1, 5, 15, 30, 60]
    - family: return_close_to_close
      horizons: [1, 5, 15, 30, 60]
    - family: realized_volatility
      horizons: [5, 15, 30, 60]
    - family: liquidity_deterioration
      horizons: [5, 15, 30, 60]
    - family: jump_tail_event
      horizons: [5, 15, 30, 60]
    - family: execution_cost_proxy
      horizons: [5, 15, 30, 60]
  tracks:
    - name: alpha
      label_families: [return_vwap_to_vwap]
      horizons: [5, 15, 30, 60]
      detailed_max_features: 80
      portfolio_max_features: 40
      detailed_max_per_family: 14
      portfolio_max_per_family: 8
    - name: risk_regime
      label_families:
        - realized_volatility
        - liquidity_deterioration
        - jump_tail_event
      horizons: [5, 15, 30, 60]
      detailed_max_features: 30
      portfolio_max_features: 0
      detailed_max_per_family: 8
    - name: cost_liquidity
      label_families: [execution_cost_proxy]
      horizons: [5, 15, 30, 60]
      detailed_max_features: 10
      portfolio_max_features: 0
      detailed_max_per_family: 4
  minimum_valid_days: 20
  minimum_coverage: 0.70
  minimum_directional_day_ratio: 0.55
  minimum_per_family: 2
  allow_in_sample_portfolio: false

study:
  nff_source_repository: "pttangent/NodeFactorFactory"
  nff_source_branch: "agent/nvg-trade-hawkes-families"
  nvg_supplement_root: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_warehouse/nvg_supplement"
  schema_resolution: "runtime Parquet schema; exact field or mathematically equivalent causal reconstruction only"
  physical_windows:
    minute_nvg: [10m, 15m, 30m]
    minute_nvg_topology: [10m, 15m, 30m]
    minute_hvg_risk: [15m, 30m, 60m]
    trade_visibility: [60s, 180s, 300s]
  factor_registry_mode: "476 legacy specs audited; 464 warehouse-exact specs materialized and raw-screened"

factor_resolution_policy:
  expected_legacy_specs: 476
  expected_physical_specs: 464
  legacy_gap: "12 C@60m price-NVG topology specs; no physical 60m topology product"
  fail_on_unavailable: true
  fail_on_zero_coverage: true
  forbid_semantic_substitution: true

labels:
  primary_execution: return_vwap_to_vwap
  diagnostic_execution: [return_open_to_open, return_close_to_close]
  state_prediction: [liquidity_deterioration, realized_volatility]
  diagnostic: [jump_tail_event, execution_cost_proxy]
  exact_elapsed_minutes: true
  entry_offset_minutes: 1
  same_session_only: true

neutralization:
  applies_to: [return_open_to_open, return_vwap_to_vwap, return_close_to_close]
  variants: [raw, standardized_cs_zscore, industry_neutral, industry_size_neutral, full_risk_neutral]
  metadata_controls: [sector_code, industry_code, log_market_cap]
  numeric_controls:
    - log_price
    - log_adv20
    - log_intraday_dollar_volume
    - active_second_ratio
    - log_trade_count
    - realized_volatility
    - intraday_market_sensitivity
    - amihud

portfolio_proxy:
  universe: final_trading_universe
  primary_execution_label: return_vwap_to_vwap
  horizons: [5, 15, 30, 60]
  costs_bps_one_way: [0, 1, 2.5, 5, 10]
  participation_rates: [0.01, 0.02, 0.05, 0.10]
  account_sizes: [100000, 500000, 1000000, 5000000, 10000000]

walk_forward:
  train_days: 60
  validation_days: 10
  test_days: 10
  step_days: 10
  primary_horizon: 30
  primary_label: return_vwap_to_vwap
  models: [equal_weight, ic_weight, ridge, elastic_net, lightgbm, gru]
  minimum_feature_coverage: 0.70
  redundancy_correlation: 0.90
  max_features: 80
  train_only_direction_freeze: true
  train_only_redundancy_filter: true
  family_ablation: true

monitoring:
  progress_interval_seconds: 30
  resource_sample_seconds: 30
  stage_events: true
  report_worker_rss: true