run:
  name: v2_1_neutralized_full_20260803_v2_2_incremental_vwap_gate
  script: nff_research/v2_1_neutralized_runner.py
  start_date: "2026-01-02"
  end_date: "2026-07-22"
  horizons: [15, 30, 60, 120]
  initial_parallel: 12
  max_parallel: 16
  min_parallel: 4
  target_cpu_percent: 90
  memory_high_water_percent: 78
  memory_min_available_gb: 32
  disk_free_floor_gb: 50
  launch_batch_size: 2
  retries: 1
  min_cross_section_n: 30
  allow_mixed_contracts: false

local_paths:
  warehouse_root: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_warehouse"
  research_root: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_research"
  raw_1m_root: "D:/DEV/AnotherNetworkFactory/RAW_DATA/1m"
  nodefactorfactory_src: "D:/DEV/AnotherNetworkFactory/NodeFactorFactory/src"
  controls_path: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_research/derived_inputs/daily_bar_controls_v2_1/daily_controls_2026-01-02_2026-07-22.parquet"

labels:
  - return_open_to_open
  - return_vwap_to_vwap
  - return_close_to_close
  - liquidity_deterioration
  - realized_volatility
  - jump_tail_event
  - execution_cost_proxy

rank_ic_methods:
  - minute_mean_cs_rank_ic
  - pooled_cs_demeaned_pct_rank_ic
  - minute_mean_cs_rank_ic_residualized
  - pooled_cs_demeaned_pct_rank_ic_residualized

universes:
  - own_feature_universe
  - common_structural
  - liquid_common_adv20_top1000

alpha_feature_policy:
  representative_feature_count: 55
  exclude_from_alpha:
    - hawkes_ready
    - warmup_fraction
    - observation_coverage
    - active_second_ratio
    - active_second_count
    - stale_ratio
    - trade_count
  use_excluded_axes_as:
    - eligibility_mask
    - neutralization_control

neutralization:
  applies_to: return_labels_only
  controls:
    - log_price
    - previous_20d_adv
    - same_minute_dollar_volume
    - active_second_ratio_300s
    - log_trade_count
    - realized_vol_60m
    - intraday_market_sensitivity_60m
  unavailable_controls:
    - sector

portfolio_proxy:
  rebalance_minutes: 15
  universe: liquid_common_adv20_top1000
  construction: equal_weight_long_short_variants
  cost_bps_per_turnover: 1.0
  accounting: same_sleeve_turnover
  variants:
    - long_high_q10_15m
    - contrarian_q10_15m
    - contrarian_q05_30m
    - contrarian_q05_60m
    - contrarian_q05_30m_hawkes_liquidity_gate
  primary_execution_label: return_vwap_to_vwap
  note: "Proxy only; not a full Qlib Recorder/model backtest. Horizon H uses ceil(H/rebalance_minutes) sleeves and compares turnover only within the same sleeve."

session:
  timezone: America/New_York
  regular_session: "09:30 <= local_time < 16:00"
