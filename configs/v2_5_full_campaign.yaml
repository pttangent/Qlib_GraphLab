research_version: "2.5"
base_runner_version: "2.4"

run:
  name: v2_5_full_campaign_20260806_r2
  script: nff_research/v2_5_full_entry.py
  start_date: "2026-01-02"
  end_date: "2026-07-22"
  horizons: [15, 30, 60, 120]
  initial_parallel: 12
  max_parallel: 16
  min_parallel: 4
  target_cpu_percent: 90
  memory_high_water_percent: 78
  memory_min_available_gb: 32
  disk_free_floor_gb: 50
  launch_batch_size: 2
  retries: 3
  min_cross_section_n: 30
  allow_mixed_contracts: false

local_paths:
  warehouse_root: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_warehouse"
  research_root: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_research"
  raw_1m_root: "D:/DEV/AnotherNetworkFactory/RAW_DATA/1m"
  nodefactorfactory_src: "D:/DEV/AnotherNetworkFactory/NodeFactorFactory/src"
  industry_metadata: "D:/DEV/AnotherNetworkFactory/warehouses/metadata/symbol_metadata.parquet"

study:
  nvg_supplement_root: "D:/DEV/AnotherNetworkFactory/warehouses/NFF_warehouse/nvg_supplement"
  universe_layers:
    - all_pit_eligible
    - common_structural
    - liquid_common_adv20_top500
    - liquid_common_adv20_top1000
    - liquid_common_adv20_top2000
    - liquid_common_adv20_top3000
    - final_trading_universe
  raw_fields_inventory: true
  derived_supplement_factor: true
  supplement_policy: "raw supplement fields are audit-only; derived directional consensus is the alpha candidate"
  factor_registry_mode: "all source fields QA plus 55 representative alpha and supplement-derived candidates"

labels:
  primary_execution: return_vwap_to_vwap
  diagnostic_execution: [return_open_to_open, return_close_to_close]
  state_prediction: [liquidity_deterioration, realized_volatility]
  diagnostic: [jump_tail_event, execution_cost_proxy]

neutralization:
  applies_to: [return_open_to_open, return_vwap_to_vwap, return_close_to_close]
  metadata_controls: [sector_code, industry_code]
  numeric_controls: [log_price, log_adv20, log_intraday_dollar_volume, active_second_ratio_300s, log_trade_count, realized_vol_60m, beta_60m_intraday_proxy]

portfolio_proxy:
  rebalance_minutes: 15
  universe: final_trading_universe
  primary_execution_label: return_vwap_to_vwap
  costs_bps_one_way: [0, 1, 2.5, 5, 10]
  participation_rates: [0.01, 0.02, 0.05, 0.10]
  account_sizes: [100000, 500000, 1000000, 5000000, 10000000]
  variants: [long_high_q10_15m, contrarian_q10_15m, contrarian_q05_30m, contrarian_q05_60m, contrarian_q05_30m_turnover_controlled]

walk_forward:
  train_days: 60
  validation_days: 10
  test_days: 10
  step_days: 10
  models: [equal_weight, ic_weight, ridge, elastic_net, lightgbm]
  primary_model: ridge
  primary_horizon: 30
  primary_label: return_vwap_to_vwap
  model_workers: 2

qlib_recorder:
  enabled: true
  experiment_name: nff_v2_5_full_campaign
  provider_subdir: qlib_provider

monitoring:
  progress_interval_seconds: 30
  resource_sample_seconds: 30
